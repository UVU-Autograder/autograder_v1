name: uvu-autograder-poc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autograder}
      POSTGRES_USER: ${POSTGRES_USER:-autograder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autograder_dev_password}
      JUDGE0_POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_poc_databases.sh:/docker-entrypoint-initdb.d/01_init_poc_databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autograder} -d ${POSTGRES_DB:-autograder}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local tag only: build once with `docker compose -f docker-compose.poc.yml build judge0`
  # after judge0.Dockerfile changes; day-to-day `up` reuses uvu-autograder-judge0:latest.
  judge0:
    build:
      context: .
      dockerfile: judge0.Dockerfile
    image: uvu-autograder-judge0:latest
    restart: unless-stopped
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "2358:2358"
    environment:
      REDIS_URL: redis://redis:6379/1
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0_dev_password}
      AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-judge0-testing-token}
      AUTHZ_HEADER: X-Auth-Token
      AUTHZ_TOKEN: ${JUDGE0_AUTH_TOKEN:-judge0-testing-token}
      ENABLE_SUBMISSION_DELETE: "true"
      ALLOW_ENABLE_NETWORK: "false"
      # Arch/systemd≥258 cannot force cgroup v1; skip isolate --cg and use rlimits instead.
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      CPU_TIME_LIMIT: "30"
      MAX_CPU_TIME_LIMIT: "35"
      WALL_TIME_LIMIT: "40"
      MAX_WALL_TIME_LIMIT: "45"
      MEMORY_LIMIT: "262144"
      MAX_MEMORY_LIMIT: "524288"
      RAILS_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:2358/languages || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # Languages table is created by Judge0 on first boot, so seed after Judge0 is healthy.
  judge0-language-seed:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      judge0:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0_dev_password}
    volumes:
      - ./scripts/seed_judge0_language_311.sql:/seed.sql:ro
    entrypoint:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "judge0",
        "-d",
        "judge0",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/seed.sql",
      ]

  judge0-worker:
    build:
      context: .
      dockerfile: judge0.Dockerfile
    image: uvu-autograder-judge0:latest
    restart: unless-stopped
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0:
        condition: service_healthy
      judge0-language-seed:
        condition: service_completed_successfully
    environment:
      REDIS_URL: redis://redis:6379/1
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0_dev_password}
      AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-judge0-testing-token}
      AUTHZ_HEADER: X-Auth-Token
      AUTHZ_TOKEN: ${JUDGE0_AUTH_TOKEN:-judge0-testing-token}
      ENABLE_SUBMISSION_DELETE: "true"
      ALLOW_ENABLE_NETWORK: "false"
      # Same as judge0: skip isolate --cg on cgroup-v2-only hosts (see deployment docs).
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      CPU_TIME_LIMIT: "30"
      MAX_CPU_TIME_LIMIT: "35"
      WALL_TIME_LIMIT: "40"
      MAX_WALL_TIME_LIMIT: "45"
      MEMORY_LIMIT: "262144"
      MAX_MEMORY_LIMIT: "524288"
      RAILS_ENV: production
    command: ["/bin/sh", "-c", "cd /api && bundle exec rake resque:work QUEUE=*"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0:
        condition: service_healthy
      judge0-language-seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://autograder:autograder_dev_password@127.0.0.1:5432/autograder}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://127.0.0.1:6379/0}
      JUDGE0_URL: ${JUDGE0_URL:-http://127.0.0.1:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-judge0-testing-token}
      JUDGE0_LANGUAGE_ID: ${JUDGE0_LANGUAGE_ID:-711}
      JUDGE0_MAX_CONCURRENT: ${JUDGE0_MAX_CONCURRENT:-2}
      SANDBOX_USE_CELERY: ${SANDBOX_USE_CELERY:-true}
      SANDBOX_UPLOAD_LIMIT: ${SANDBOX_UPLOAD_LIMIT:-5}
      SANDBOX_UPLOAD_WINDOW_SECONDS: ${SANDBOX_UPLOAD_WINDOW_SECONDS:-3600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      DEFAULT_MAX_FILES: ${DEFAULT_MAX_FILES:-100}
      DEFAULT_MAX_ZIP_SIZE: ${DEFAULT_MAX_ZIP_SIZE:-52428800}
      TEST_EXECUTION_TIMEOUT_SECONDS: ${TEST_EXECUTION_TIMEOUT_SECONDS:-30}
      ARTIFACT_STORAGE_DIR: ${ARTIFACT_STORAGE_DIR:-/data/artifacts}
      RUN_ALEMBIC_MIGRATIONS: ${RUN_ALEMBIC_MIGRATIONS:-true}
      SEED_DATABASE: ${SEED_DATABASE:-true}
      ENABLE_MOCK_LOGIN: ${ENABLE_MOCK_LOGIN:-true}
      JWT_SECRET: ${JWT_SECRET:-dev_fallback_secret_longer_than_32_characters_for_security_compliance}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-5}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-ollama}
      LOCAL_LLM_ENDPOINT: ${LOCAL_LLM_ENDPOINT:-http://127.0.0.1:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5-coder:7b}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://10.115.20.200:3000,https://autograder-frontend-mockup.vercel.app}
    volumes:
      - backend_data:/data

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0:
        condition: service_healthy
      judge0-language-seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://autograder:autograder_dev_password@127.0.0.1:5432/autograder}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://127.0.0.1:6379/0}
      JUDGE0_URL: ${JUDGE0_URL:-http://127.0.0.1:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-judge0-testing-token}
      JUDGE0_LANGUAGE_ID: ${JUDGE0_LANGUAGE_ID:-711}
      JUDGE0_MAX_CONCURRENT: ${JUDGE0_MAX_CONCURRENT:-2}
      SANDBOX_USE_CELERY: ${SANDBOX_USE_CELERY:-true}
      SANDBOX_UPLOAD_LIMIT: ${SANDBOX_UPLOAD_LIMIT:-5}
      SANDBOX_UPLOAD_WINDOW_SECONDS: ${SANDBOX_UPLOAD_WINDOW_SECONDS:-3600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      DEFAULT_MAX_FILES: ${DEFAULT_MAX_FILES:-100}
      DEFAULT_MAX_ZIP_SIZE: ${DEFAULT_MAX_ZIP_SIZE:-52428800}
      TEST_EXECUTION_TIMEOUT_SECONDS: ${TEST_EXECUTION_TIMEOUT_SECONDS:-30}
      ARTIFACT_STORAGE_DIR: ${ARTIFACT_STORAGE_DIR:-/data/artifacts}
      RUN_ALEMBIC_MIGRATIONS: "false"
      SEED_DATABASE: "false"
      ENABLE_MOCK_LOGIN: ${ENABLE_MOCK_LOGIN:-true}
      JWT_SECRET: ${JWT_SECRET:-dev_fallback_secret_longer_than_32_characters_for_security_compliance}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-5}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-ollama}
      LOCAL_LLM_ENDPOINT: ${LOCAL_LLM_ENDPOINT:-http://127.0.0.1:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5-coder:7b}
    command: ["celery", "-A", "app.integrations.celery.app", "worker", "--loglevel=info", "-Q", "sandbox,official,default"]
    volumes:
      - backend_data:/data

  # Schedules periodic tasks (e.g. cleanup_expired_workspaces) for the zero-retention
  # policy. Mirrors celery-worker's env/deps; only the command differs.
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0:
        condition: service_healthy
      judge0-language-seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://autograder:autograder_dev_password@127.0.0.1:5432/autograder}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://127.0.0.1:6379/0}
      JUDGE0_URL: ${JUDGE0_URL:-http://127.0.0.1:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-judge0-testing-token}
      JUDGE0_LANGUAGE_ID: ${JUDGE0_LANGUAGE_ID:-711}
      JUDGE0_MAX_CONCURRENT: ${JUDGE0_MAX_CONCURRENT:-2}
      SANDBOX_USE_CELERY: ${SANDBOX_USE_CELERY:-true}
      SANDBOX_UPLOAD_LIMIT: ${SANDBOX_UPLOAD_LIMIT:-5}
      SANDBOX_UPLOAD_WINDOW_SECONDS: ${SANDBOX_UPLOAD_WINDOW_SECONDS:-3600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      DEFAULT_MAX_FILES: ${DEFAULT_MAX_FILES:-100}
      DEFAULT_MAX_ZIP_SIZE: ${DEFAULT_MAX_ZIP_SIZE:-52428800}
      TEST_EXECUTION_TIMEOUT_SECONDS: ${TEST_EXECUTION_TIMEOUT_SECONDS:-30}
      ARTIFACT_STORAGE_DIR: ${ARTIFACT_STORAGE_DIR:-/data/artifacts}
      RUN_ALEMBIC_MIGRATIONS: "false"
      SEED_DATABASE: "false"
      ENABLE_MOCK_LOGIN: ${ENABLE_MOCK_LOGIN:-true}
      JWT_SECRET: ${JWT_SECRET:-dev_fallback_secret_longer_than_32_characters_for_security_compliance}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-5}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-ollama}
      LOCAL_LLM_ENDPOINT: ${LOCAL_LLM_ENDPOINT:-http://127.0.0.1:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5-coder:7b}
    command: ["celery", "-A", "app.integrations.celery.app", "beat", "--loglevel=info", "--schedule=/data/celerybeat-schedule"]
    volumes:
      - backend_data:/data

volumes:
  postgres_data:
  redis_data:
  backend_data:
