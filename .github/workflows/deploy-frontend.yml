# Place at: .github/workflows/deploy-frontend.yml  (must exist on the dev branch)
name: Deploy frontend to Vercel

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"                              # only frontend changes trigger a deploy
      - ".github/workflows/deploy-frontend.yml"    # ...or changes to this workflow
  workflow_dispatch:                               # manual "Run workflow" button

# If two pushes land close together, only the newest one deploys
concurrency:
  group: vercel-frontend
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}       # orgId from frontend/.vercel/project.json
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }} # projectId from the same file

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20                         # match what the team uses locally

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings and env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
