name: uvu-autograder-testing

# Local/integration testing harness for the app stack plus Judge0 connectivity.
# Canonical production execution uses Judge0 with Kata-backed VM isolation on
# separate execution infrastructure; this Compose file does not attempt to
# fully reproduce the Kata runtime layer.

services:
  postgres:
    image: postgres:16-alpine
    container_name: uvu-autograder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autograder
      POSTGRES_USER: autograder
      POSTGRES_PASSWORD: autograder_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autograder -d autograder"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uvu-autograder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge0:
    image: judge0/judge0:1.13.1
    container_name: uvu-autograder-judge0
    restart: unless-stopped
    ports:
      - "2358:2358"
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: autograder
      POSTGRES_USER: autograder
      POSTGRES_PASSWORD: autograder_dev_password
      AUTH_TOKEN: judge0-testing-token
      ALLOW_ENABLE_NETWORK: "false"
      CPU_TIME_LIMIT: "10"
      MAX_CPU_TIME_LIMIT: "15"
      WALL_TIME_LIMIT: "20"
      MAX_WALL_TIME_LIMIT: "30"
      MEMORY_LIMIT: "262144"
      MAX_MEMORY_LIMIT: "524288"
      RAILS_ENV: production
      EXECUTION_ISOLATION_EXPECTATION: kata-in-production
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:2358/languages || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  judge0-worker:
    image: judge0/judge0:1.13.1
    container_name: uvu-autograder-judge0-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: autograder
      POSTGRES_USER: autograder
      POSTGRES_PASSWORD: autograder_dev_password
      AUTH_TOKEN: judge0-testing-token
      ALLOW_ENABLE_NETWORK: "false"
      CPU_TIME_LIMIT: "10"
      MAX_CPU_TIME_LIMIT: "15"
      WALL_TIME_LIMIT: "20"
      MAX_WALL_TIME_LIMIT: "30"
      MEMORY_LIMIT: "262144"
      MAX_MEMORY_LIMIT: "524288"
      RAILS_ENV: production
      EXECUTION_ISOLATION_EXPECTATION: kata-in-production
    command:
      - /bin/sh
      - -c
      - |
        cd /judge0 && bundle exec rails db:prepare && bundle exec rake resque:work QUEUE=default

  backend:
    image: python:3.11-slim
    container_name: uvu-autograder-backend
    restart: unless-stopped
    working_dir: /workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://autograder:autograder_dev_password@postgres:5432/autograder
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      JUDGE0_URL: http://judge0:2358
      JUDGE0_AUTH_TOKEN: judge0-testing-token
      EXECUTION_ENGINE: judge0
      EXECUTION_ISOLATION_LAYER: kata
      JUDGE0_RETENTION_MODE: delete_after_retrieval
      AZURE_OPENAI_API_KEY: replace-me
      AZURE_OPENAI_ENDPOINT: https://replace-me.openai.azure.com
      MOSS_USER_ID: replace-me
      SANDBOX_UPLOAD_LIMIT: "5"
      SANDBOX_UPLOAD_WINDOW_SECONDS: "3600"
      CLEANUP_TTL_SECONDS: "0"
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
    command:
      - sh
      - -c
      - |
        echo "Backend service placeholder: replace this command with uvicorn once the FastAPI app is executable."
        sleep infinity

  celery-worker:
    image: python:3.11-slim
    container_name: uvu-autograder-celery-worker
    restart: unless-stopped
    working_dir: /workspace/backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      judge0:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://autograder:autograder_dev_password@postgres:5432/autograder
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      JUDGE0_URL: http://judge0:2358
      JUDGE0_AUTH_TOKEN: judge0-testing-token
      EXECUTION_ENGINE: judge0
      EXECUTION_ISOLATION_LAYER: kata
      JUDGE0_RETENTION_MODE: delete_after_retrieval
      AZURE_OPENAI_API_KEY: replace-me
      AZURE_OPENAI_ENDPOINT: https://replace-me.openai.azure.com
      MOSS_USER_ID: replace-me
      SANDBOX_UPLOAD_LIMIT: "5"
      SANDBOX_UPLOAD_WINDOW_SECONDS: "3600"
      CLEANUP_TTL_SECONDS: "0"
    volumes:
      - ./:/workspace
    command:
      - sh
      - -c
      - |
        echo "Celery worker placeholder: replace this command with a real Celery worker once tasks are executable."
        sleep infinity

volumes:
  postgres_data:
  redis_data:
