# ==============================================================================
# UVU Autograder — Production HTTPS / TLS Nginx Configuration (Ports 80 & 443)
# Location: /etc/nginx/sites-available/autograder-tls.conf
# Target Host: Dell Workstation (autograder.cs.uvu.edu / 10.115.20.200)
# Reference: docs/guides/workstation.md
# ==============================================================================

# 1. HTTP -> HTTPS Permanent Redirect
server {
    listen 80;
    listen [::]:80;
    server_name autograder.cs.uvu.edu;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autograder.cs.uvu.edu;

    # Institutional TLS Certificates (Provided by UVU IT)
    ssl_certificate /etc/ssl/certs/autograder_cs_uvu_edu.crt;
    ssl_certificate_key /etc/ssl/private/autograder_cs_uvu_edu.key;

    # Mozilla Intermediate TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum bundle upload size (matches application 50MB upload limit + padding)
    client_max_body_size 52M;

    # 1. Next.js Microsoft Entra Auth Handlers (Route to Next.js port 3000)
    location /api/auth/microsoft/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # 2. API Route Handling (Strip /api prefix and proxy to FastAPI backend)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 2. Health & OpenAPI Probes (Direct proxy to FastAPI backend)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. Next.js Frontend (Pages, static assets, Next.js API routes)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
