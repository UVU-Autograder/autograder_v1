services:
  judge0:
    runtime: ${KATA_DOCKER_RUNTIME:-kata-runtime}
    privileged: false
    extra_hosts:
      - "postgres:host-gateway"
      - "redis:host-gateway"
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_CHROOT
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - MKNOD
      - CHOWN
      - FOWNER
      - KILL

  judge0-worker:
    runtime: ${KATA_DOCKER_RUNTIME:-kata-runtime}
    privileged: false
    extra_hosts:
      - "postgres:host-gateway"
      - "redis:host-gateway"
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_CHROOT
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - MKNOD
      - CHOWN
      - FOWNER
      - KILL

